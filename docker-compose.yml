version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: vaxkavach
      POSTGRES_PASSWORD: vaxpassword
      POSTGRES_DB: vaxkavach_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaxkavach -d vaxkavach_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://vaxkavach:vaxpassword@db:5432/vaxkavach_db
      - API_BASE_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
