<title>India Map Component (from Shapefile)</title>
<style>
  /*
    ------------------------------------------------------------
    INDIA MAP COMPONENT — generated from India_State.shp
    Real state/UT boundaries, Douglas-Peucker simplified, projected
    with a simple equirectangular (lon/lat -> x/y) projection.
    36 paths total (28 states + 8 union territories).

    Structure:
      .india-map-wrapper        -> outer container
        svg#india-map            -> viewBox 0 0 600.00 642.12
          g#india-states
            path.state#state-N   -> one path per state/UT

    NOTE ON NAMES: only the .shp (geometry) was provided, with no
    matching .dbf (attribute table), so real state names aren't
    available -- paths are labeled State 0..35 by shapefile record
    order. Send India_State.dbf (same base filename) and I'll wire
    in real names for id / <title> / data-name on each path.

    Two cartographic inset-frame rectangles (legend boxes around the
    Andaman & Nicobar / Lakshadweep insets in the source file) were
    detected and excluded -- they aren't real coastline.

    Customize appearance via the CSS custom properties in :root.
    ------------------------------------------------------------
  */
  :root {
    --map-fill: none;
    --map-stroke: #4A90E2;
    --map-stroke-width: 0.8;
    --map-hover-fill: rgba(74, 144, 226, 0.15);
    --map-bg: transparent;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f8fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .india-map-wrapper {
    width: 100%;
    max-width: 520px;
    padding: 24px;
    background: var(--map-bg);
  }

  #india-map {
    width: 100%;
    height: auto;
    display: block;
  }

  .state {
    fill: var(--map-fill);
    stroke: var(--map-stroke);
    stroke-width: var(--map-stroke-width);
    stroke-linejoin: round;
    transition: fill 0.15s ease;
    cursor: pointer;
  }

  .state:hover {
    fill: var(--map-hover-fill);
  }
</style>
</head>
